[project]
name = "uuyp-trade-analyzer"
version = "0.1.0"
description = "悠悠有品(UUYP) CS2 交易账单导出与盈亏分析 Web 服务"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "flask>=3.0.0",
    "gunicorn>=22.0.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 显式锁定为 ruff 默认规则集，避免用户级配置泄入导致本地与 CI 行为不一致
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
